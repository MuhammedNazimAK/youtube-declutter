<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <style>
        body {
            font-family: system-ui, sans-serif;
            box-sizing: border-box;
            margin: 0;
            width: 280px;
            padding: 12px;
        }
        label {
            display: block;
            font-size: 13px;
            margin-bottom: 8px;
        }
        input[type="range"] {
            width: 100%;
            margin-bottom: 8px;
        }
        #value {
            font-weight: 600;
        }
        .toggle-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }
        .text-container {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .toggle-label {
            font-size: 13px;
            margin-bottom: 0;
            cursor: pointer;
            display: inline;
        }
        .tooltip {
            cursor: help;
            font-size: 12px;
            color: #666;
            position: relative;
        }
        .tooltip:hover::after {
            content: attr(data-tooltip);
            position: absolute;
            bottom: 125%;
            left: 50%;
            transform: translateX(-50%);
            background-color: #333;
            color: #fff;
            padding: 5px 8px;
            border-radius: 4px;
            font-size: 11px;
            white-space: normal;
            width: 140px;
            text-align: center;
            z-index: 10;
            box-shadow: 0px 2px 4px rgba(0, 0, 0, 0.2);
        }
        .switch {
            position: relative;
            display: inline-block;
            width: 44px;
            height: 24px;
            flex-shrink: 0;
            margin-bottom: 0;
        }
        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #ccc;
            transition: .4s;
        }
        .slider::before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .4s;
        }
        input:checked + .slider {
            background-color: #2196F3;
        }
        input:focus + .slider {
            box-shadow: 0 0 1px #2196F3;
        }
        input:checked + .slider:before {
            transform: translateX(20px);
        }
        .slider.round {
            border-radius: 24px;
        }
        .slider.round:before {
            border-radius: 50%;
        }
    </style>
</head>
<body>
    <label>Saturation: <span id="value">0.6</span></label>
    <input type="range" id="slider" min="0" max="1" step="0.05" value="0.6" />
    <div class="toggle-row">
        <div class="text-container">
            <label for="yt-toggle" class="toggle-label">Remove More from Youtube</label>
            <span class="tooltip" data-tooltip="Hides YouTube Premium, Music, and Kids links in the sidebar">ⓘ</span>
        </div>
        <label class="switch">
            <input type="checkbox" id="yt-toggle">
            <span class="slider round"></span>
        </label>
    </div>
    <script src="popup.js"></script>
</body>
</html>
